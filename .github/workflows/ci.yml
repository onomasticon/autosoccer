name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test, build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autosoccer
          POSTGRES_PASSWORD: autosoccer
          POSTGRES_DB: autosoccer
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U autosoccer -d autosoccer"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://autosoccer:autosoccer@localhost:54329/autosoccer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Migrate
        run: bun run db:migrate
      - name: Tests
        run: bun run test
      - name: Build web
        run: bun run build
      - name: Boot smoke test (API + web + DB)
        run: bun run smoke
