name: Deploy

# Builds both images after CI passes on main, pushes them to GHCR tagged with the commit SHA,
# then deploys that tag to the exe.dev VM (docs/operations/deploy-cloudflare-exe.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to deploy (default main)
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  images:
    name: Build and push images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || 'main' }}
          submodules: true
      - id: sha
        run: echo "tag=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Runtime image (api, worker, migrate)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/onomasticon/autosoccer:${{ steps.sha.outputs.tag }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Web image (Node SSR)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/onomasticon/autosoccer-web:${{ steps.sha.outputs.tag }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to exe.dev VM
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      TAG: ${{ needs.images.outputs.tag }}
      # exe.dev routes SSH by the vm+<name> user; this destination form always works.
      DEST: vm+${{ secrets.DEPLOY_VM }}@vm.exe.xyz
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.images.outputs.tag }}
          sparse-checkout: deploy/exe
      - name: SSH credentials
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Ship compose file and scripts
        run: |
          ssh -i ~/.ssh/id_deploy "$DEST" 'mkdir -p ~/autosoccer'
          scp -i ~/.ssh/id_deploy deploy/exe/compose.yml deploy/exe/deploy.sh deploy/exe/backup.sh "$DEST:autosoccer/"
      - name: Deploy
        run: ssh -i ~/.ssh/id_deploy "$DEST" "~/autosoccer/deploy.sh '$TAG'"
